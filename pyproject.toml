[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-touchpoint-graph"
version = "0.1.0"
description = "Persistent swarm knowledge graph: record agent touchpoints, find clusters and single points of failure."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kubo100x" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
agent-touchpoint-graph = "agent_touchpoint_graph.cli:main"

[tool.setuptools.packages.find]
include = ["agent_touchpoint_graph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
